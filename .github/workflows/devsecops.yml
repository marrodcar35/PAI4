name: Pipeline DevSecOps

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # ETAPA 1: Build (Construcción de la aplicación / contenedor)
  build:
    name: 1. Build (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker de prueba
        run: docker build -t juice-shop-test .

  # ETAPA 2: Análisis de Seguridad (SAST, SCA, IaC)
  analisis-seguridad:
    name: 2. Seguridad (SAST, SCA, IaC)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: SAST - Semgrep (Modo Aviso)
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan --config=auto --json -o /src/semgrep-report.json --error /src

      - name: SCA - Trivy Dependencias (Modo Aviso)
        continue-on-error: true
        run: |
          npm install --package-lock-only --ignore-scripts
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy fs --scanners vuln --severity CRITICAL,HIGH,MEDIUM --exit-code 1 --format json -o /src/trivy-sca-report.json /src

      - name: IaC - Checkov (Quality Gate Bloqueante)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" bridgecrew/checkov -d /src --framework dockerfile -o json > checkov-report.json

      - name: Subir informes generados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-seguridad
          path: |
            semgrep-report.json
            trivy-sca-report.json
            checkov-report.json

  # ETAPA 3: Producción (BLOQUEADA si la etapa 2 falla por el Quality Gate)
  produccion:
    name: 3. Despliegue a Producción
    needs: analisis-seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar versión aprobada
        run: echo "Todos los quality gates superados. Desplegando en producción..."